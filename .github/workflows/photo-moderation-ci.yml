name: Photo Moderation CI

on:
  pull_request:
    branches: [ master, main ]
    paths:
      - 'Pryan-Fire/projects/backend/anewluv-photo-moderation/**'
      - '.github/workflows/photo-moderation-ci.yml'

jobs:
  photo-moderation-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify runtime path exists
        run: |
          if [ ! -d Pryan-Fire/projects/backend/anewluv-photo-moderation ]; then
            echo "Photo moderation path missing on this branch; skip."
            exit 0
          fi

      - name: Install dependencies
        run: |
          cd Pryan-Fire/projects/backend/anewluv-photo-moderation
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run unit tests
        run: |
          cd Pryan-Fire/projects/backend/anewluv-photo-moderation
          PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Run dry-run smoke
        run: |
          cd Pryan-Fire/projects/backend/anewluv-photo-moderation
          PYTHONPATH=src python3 -m photo_sweeper --once --dry-run --limit 5
